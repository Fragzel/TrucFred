# Collecte quotidienne → état sur la branche data → site sur GitHub Pages.
# Voir docs/PLAN.md (§2.2 et §2.8) et le runbook du README.
name: update

on:
  schedule:
    - cron: "17 6 * * *" # minute décalée de l'heure pile, où les runs planifiés sont retardés
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      offline:
        description: "Reconstruire le site sans appeler les API"
        type: boolean
        default: false
      accept_drop:
        description: "Accepter une forte baisse du nombre d'abonnements"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**"] # itérer sur la page sans consommer de quotas

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      level: ${{ steps.run.outputs.level }}
      state_written: ${{ steps.run.outputs.state_written }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupérer l'état (branche data)
        run: |
          mkdir -p data
          status=0
          git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --quiet --no-tags --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          elif [ "$status" -eq 2 ]; then
            echo "Pas encore de branche data : démarrage à zéro."
          else
            exit "$status"
          fi

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - run: uv sync --locked --no-dev

      - id: run
        name: Collecter et construire le site
        env:
          OFFLINE: ${{ github.event_name == 'push' || inputs.offline }}
          ACCEPT_DROP: ${{ inputs.accept_drop }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_AUTHORIZED_AT: ${{ vars.SPOTIFY_AUTHORIZED_AT }}
          NEWREL_SECRETS_PAT: ${{ secrets.NEWREL_SECRETS_PAT }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SOUNDCLOUD_USER_URN: ${{ vars.SOUNDCLOUD_USER_URN }}
        run: |
          args=()
          if [ "$OFFLINE" = "true" ]; then args+=(--offline); fi
          if [ "$ACCEPT_DROP" = "true" ]; then args+=(--accept-drop); fi
          uv run --no-dev newrel run --state-dir data --out _site "${args[@]}"

      - name: Transmettre l'état au job persist
        if: steps.run.outputs.state_written == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state
          path: |
            data/state.json
            data/releases.json
          retention-days: 7
          if-no-files-found: error

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Seul job autorisé à écrire dans le dépôt, et il n'exécute que git.
  persist:
    needs: build
    if: needs.build.outputs.state_written == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: state
          path: data

      - name: Réécrire la branche data (un seul commit, sans historique)
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git init --quiet --initial-branch=data
          git add state.json releases.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "data: run $RUN_ID"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verdict:
    needs: [build, persist, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Garder le cron actif (désactivé après 60 jours sans activité)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" --silent \
            || echo "::warning::Impossible de rafraîchir l'activation du workflow."

      - name: Verdict
        env:
          BUILD: ${{ needs.build.result }}
          PERSIST: ${{ needs.persist.result }}
          DEPLOY: ${{ needs.deploy.result }}
          LEVEL: ${{ needs.build.outputs.level }}
        run: |
          echo "build=$BUILD persist=$PERSIST deploy=$DEPLOY niveau=$LEVEL"
          if [ "$BUILD" != "success" ] || [ "$PERSIST" = "failure" ] || [ "$DEPLOY" = "failure" ] \
             || [ "$LEVEL" = "error" ]; then
            echo "::error::Run dégradé : voir le résumé du job build."
            exit 1
          fi
