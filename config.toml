# Configuration publique de newrel. Aucun secret ici : ils vivent dans les secrets GitHub
# (ou dans .env.local pour les runs locaux, fichier ignoré par git).

[general]
timezone = "Europe/Paris"    # fuseau des dates affichées et du « aujourd'hui »
window_days = 90             # profondeur d'historique affichée
new_days = 7                 # badge « Nouveau » : détectée il y a au plus N jours…
new_max_age_days = 14        # … et sortie il y a au plus N jours
stale_hours = 36             # bannière sur la page si les données ont plus de N heures
followings_drop_ratio = 0.3  # chute d'abonnements au-delà de laquelle la liste reçue est ignorée
token_warn_days = 150        # avertissement : le refresh token Spotify expire à 6 mois
token_error_days = 170       # run rouge peu avant l'expiration

[spotify]
market = "FR"
groups = ["album", "single"]  # ni featurings (appears_on) ni compilations
max_pages = 5
requests_per_second = 2.0
time_budget_minutes = 15
max_retry_after_seconds = 120
# Quota Development Mode mesuré le 22/10/2026 : ~100 appels catalogue par 24 h, partagés par toutes
# les apps du compte développeur (et par « newrel fetch » en local). On en garde 10 de marge.
daily_catalog_calls = 90
active_within_days = 365    # artiste « actif » : une sortie dans l'année
active_interval_days = 2    # vérifié environ tous les 2 jours…
dormant_interval_days = 7   # … contre tous les 7 jours pour un artiste en sommeil
full_check_days = 30        # relecture complète au moins une fois par mois, même sans changement

[soundcloud]
# Ton compte (SOUNDCLOUD_USER_URN) est enregistré par « uv run newrel auth soundcloud ».
exclude = []                # comptes suivis à ignorer : URN ou nom dans l'URL du profil
requests_per_second = 1.5   # l'API accepte environ 100 requêtes par minute
tracks_limit = 20           # derniers sons lus par compte
playlists_limit = 10        # dernières playlists lues par compte (albums, EP, singles)
max_pages = 3
time_budget_minutes = 15
max_retry_after_seconds = 120
full_check_days = 30

[notify]
# Notification ntfy.sh après un run qui trouve des nouveautés (« uv run newrel auth ntfy »).
# Les comptes masqués sur la page ne sont pas connus ici : exclus-les dans [soundcloud] exclude.
site_url = "https://fragzel.github.io/TrucFred/"   # ouvert au clic sur la notification
types = ["album", "ep", "single", "track"]          # retire "track" pour ignorer les simples sons
max_items = 10
server = "https://ntfy.sh"
